<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Picker z DaisyUI</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black-50">
<div class="min-h-screen flex items-center justify-center">
    <div class="card bg-base-100 shadow-xl p-6 max-w-md w-full">
        <h2 class="text-2xl font-bold text-center mb-4">Wybierz datę</h2>
        <div class="form-control">
            <label class="label">
                <span class="label-text">Data</span>
            </label>
            <input type="date" class="input input-bordered w-full bg-base-200 focus:bg-base-100 focus:border-primary" />
        </div>
    </div>
</div>
</body>
</html>
